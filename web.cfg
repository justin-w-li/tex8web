% tex4ht config for the HTML build, run from a notes repo:
%   make4ht -u -c ../web/web.cfg -e ../web/web.mk4 -B build/html main.tex
% output is build/html/main.html + main.css + fonts/; math is MathML rendered
% by MathJax. light mode uses the PDF colors (colors.sty, \hypersetup); dark
% mode uses the *-dark colors below. the page follows the system theme unless
% the root element has data-theme="light" or data-theme="dark"

\Preamble{xhtml,mathml,mathjax}

% dark mode colors
\definecolor{bg-dark}{RGB}{30, 30, 30}
\definecolor{text-dark}{RGB}{227, 227, 227}

\definecolor{hlpink-dark}{RGB}{77, 42, 52}
\definecolor{hlyellow-dark}{RGB}{74, 67, 37}
\definecolor{hlblue-dark}{RGB}{31, 63, 71}
\definecolor{hlgreen-dark}{RGB}{38, 63, 40}
\definecolor{hlpurple-dark}{RGB}{53, 43, 71}

\definecolor{inkpink-dark}{RGB}{242, 139, 139}
\definecolor{inkyellow-dark}{RGB}{224, 200, 120}
\definecolor{inkblue-dark}{RGB}{143, 168, 240}
\definecolor{inkgreen-dark}{RGB}{140, 201, 138}
\definecolor{inkpurple-dark}{RGB}{185, 163, 222}

\definecolor{link-dark}{RGB}{108, 180, 255}
\definecolor{cite-dark}{RGB}{95, 211, 160}
\definecolor{url-dark}{RGB}{242, 127, 176}


\makeatletter
% \colorbox can't hold math inside MathML, so shade the math directly
\RenewDocumentCommand{\my@highlight}{m m m}{%
    \TextOrMath
        {\HCode{<span class="#2">}#3\HCode{</span>}}
        {\HCode{<mrow class="#2">}#3\HCode{</mrow>}}%
}
\RenewDocumentCommand{\my@ink}{m m}{%
    \TextOrMath
        {\HCode{<span class="#1">}#2\HCode{</span>}}
        {\HCode{<mrow class="#1">}#2\HCode{</mrow>}}%
}
% mathtools wraps \bigl( in \mathopen, which makes tex4ht drop the size, and
% wraps \left( (starred \paren* etc.) in \mathopen{}\mathclose\bgroup ..
% \aftergroup\egroup, which tex4ht can't follow (see also \mleftright below)
\@for\my@name:=abs,norm,inner,ceil,floor,paren,brak,set\do{%
    \expandafter\reDeclarePairedDelimiterInnerWrapper
        \csname\my@name\endcsname{nostarscaled}{#1#2#3}%
    \expandafter\reDeclarePairedDelimiterInnerWrapper
        \csname\my@name\endcsname{star}{#1#2#3}%
}
% tex4ht wraps \bigl( ... \bigr) in an <mrow>, which breaks when the pair
% spans a line break in align; emit just the sized <mo>, with min/maxsize
% (mathsize would stretch the normal glyph, thickening its stroke). TeX's \big
% and co. pick delimiters 1.2em, 1.8em, 2.4em and 3em tall, in ems of the
% extension font (web.mk4 scales them to it); ask for a hair under, since
% MathJax's 1.2em glyphs fall just short of 1.2em and it would skip to the
% next size (as its own \big does).
% not fences: MathJax treats a row between stretchy fences as \left..\right,
% which gets space around it
\newcommand{\my@bigdelim}[2]{% size, height
    \Configure{#1l}
        {\bgroup\Configure{#1}{}{}{}{}%
         \Configure{mathopen}{*}
            {<mo class="MathClass-open" fence="false" stretchy="true" symmetric="true" minsize="#2" maxsize="#2">}{</mo>}
            {\Configure{mathopen}{}{}{}{}}}
        {\egroup}%
    \Configure{#1r}
        {\bgroup\Configure{#1}{}{}{}{}%
         \Configure{mathclose}{*}
            {<mo class="MathClass-close" fence="false" stretchy="true" symmetric="true" minsize="#2" maxsize="#2">}{</mo>}
            {\Configure{mathclose}{}{}{}{}}}
        {\egroup}%
}
\my@bigdelim{big}{1.19em}
\my@bigdelim{Big}{1.79em}
\my@bigdelim{bigg}{2.39em}
\my@bigdelim{Bigg}{2.99em}
% tex4ht's \nolinkurl chokes on "_" inside \author
\renewcommand{\nolinkurl}[1]{\texttt{\detokenize{#1}}}
% tex4ht's cleveref links only the number of \cref; hand cleveref the link
% start/end instead, so nameinlink makes all of "Lemma 1" the link, as in
% the PDF
\def\my@setcref#1#2{\bgroup
    \def\rEfLiNK##1##2{\Link{##1}{}}%
    \def\XRrEfLiNK[##1]##2##3{\Link[##1]{##2}{}}%
    \cref@getlabel{#2}{\@templabel}%
    #1{\@templabel}%
      {\expandafter\expandafter\expandafter\@firstoffive\csname r@#2\endcsname{}{}{}{}{}}%
      {\EndLink}%
    \egroup
}
\HLet\@@@setcref\my@setcref


% a length in ems of the body font
\newcommand{\my@em}[1]{\strip@pt\dimexpr#1*65536/\dimexpr\f@size pt\relax\relax em}
% css variables: \my@addvar{list}{css name}{color}
\newcommand{\my@addvar}[3]{%
    \convertcolorspec{named}{#3}{HTML}\my@hex
    \edef#1{#1 --#2: \#\my@hex;}%
}
\newcommand{\my@light}{}
\newcommand{\my@dark}{}
\my@addvar\my@light{bg}{white}
\my@addvar\my@light{text}{black}
\my@addvar\my@light{link}{\@linkcolor}
\my@addvar\my@light{cite}{\@citecolor}
\my@addvar\my@light{url}{\@urlcolor}
\my@addvar\my@dark{bg}{bg-dark}
\my@addvar\my@dark{text}{text-dark}
\my@addvar\my@dark{link}{link-dark}
\my@addvar\my@dark{cite}{cite-dark}
\my@addvar\my@dark{url}{url-dark}
\@for\my@name:=hlpink,hlyellow,hlblue,hlgreen,hlpurple,%
        inkpink,inkyellow,inkblue,inkgreen,inkpurple\do{%
    \my@addvar\my@light{\my@name}{\my@name}%
    \my@addvar\my@dark{\my@name}{\my@name-dark}%
}
% generated pictures (tikz) are black line art; invert them in dark mode
\edef\my@light{\my@light\space --picture-filter: none;}
\edef\my@dark{\my@dark\space --picture-filter: invert(1);}
\makeatother


\begin{document}
% tex4ht's \left/\right call the \left/\right from before \begin{document},
% which \mleftright (notes.sty) turned into the same \mathclose\bgroup trick;
% that drops the MathML for everything inside \left..\right, bmatrix, cases
\makeatletter
\expandafter\let\csname o:left:\endcsname\mleftright@OrgLeft
\expandafter\let\csname o:right:\endcsname\mleftright@OrgRight
\makeatother
% tex4ht writes \  (an ordinary, breakable space in TeX) as a no-break
% space, like ~; write a space
\Configure{ }
    {\ifmathml \ifmtext \space \else
        \HCode{<mspace width="0.33em" class="nbsp"></mspace>}\fi
     \else \HCode{ }\fi}
% tex4ht finds spaces from the gaps between glyphs, and misses the one after
% inline math that ends in a symbol (\}, \infty, \mathcal{H}); write out the
% space that follows inline math (the browser collapses a doubled one)
\makeatletter
\Configure{$}
    {\Configure{@math}{display="inline"}\DviMath}
    {\EndDviMath\aftergroup\my@mathspace}
    {}
\def\my@mathspace{\futurelet\my@next\my@mathspace@check}
\def\my@mathspace@check{\ifx\my@next\@sptoken\HCode{ }\fi}
\makeatother
% tex4ht writes the table of contents with \texorpdfstring's plain-text
% argument, meant for PDF bookmarks; HTML can show the TeX one, as the PDF's
% table of contents does
\makeatletter
\Configure{writetoc}{\let\texorpdfstring\@firstoftwo}
\makeatother
% tex4ht maps \mathcal to mathvariant="script", which MathJax draws in a
% rounder script face; ask for the TeX calligraphic face instead
\renewcommand{\mathcal}[1]{{\HCode{<mi mathvariant="-tex-calligraphic">#1</mi>}}}
% tex4ht's _ takes a single token, so x_\mr{op} and \underbrace{..}_\text{..}
% lose their argument. wrap each font command in braces, and have _ expand
% these commands (to that brace group) before taking its token
\makeatletter
\def\my@sbfonts{\mr,\mb,\mc,\mf,\ms,%
    \mathrm,\mathbf,\mathcal,\mathfrak,\mathsf,\mathbb,\mathit,\mathtt,\text,\bm}
\def\my@scriptfix#1{\def\my@after{#1}\futurelet\my@next\my@scriptfix@check}
\def\my@scriptfix@check{%
    \@tempswafalse
    \@for\my@f:=\my@sbfonts\do{\expandafter\ifx\my@f\my@next\@tempswatrue\fi}%
    \if@tempswa\expandafter\@firstoftwo\else\expandafter\@secondoftwo\fi
        {\expandafter\my@after\romannumeral-`0}%
        {\my@after}%
}
% x_.. goes through \S:b; x^.._.. goes through \SUP:SUB
\expandafter\let\expandafter\my@Sb\csname S:b\endcsname
\expandafter\def\csname S:b\endcsname{\my@scriptfix\my@Sb}
\expandafter\let\expandafter\my@SupSub\csname SUP:SUB\endcsname
\expandafter\def\csname SUP:SUB\endcsname#1{\my@scriptfix{\my@SupSub#1}}
\newcommand{\my@bracefont}[1]{%
    \expandafter\let\csname my@orig\string#1\endcsname#1%
    \edef#1##1{{\expandafter\noexpand\csname my@orig\string#1\endcsname{##1}}}%
}
\my@bracefont\mathrm
\my@bracefont\mathbf
\my@bracefont\mathsf
\my@bracefont\mathit
\my@bracefont\mathtt
\my@bracefont\mathbb
\my@bracefont\mathfrak
\my@bracefont\text
% \bm and \mathbf come out identical (bold upright); mark \bm so web.mk4 can
% make it bold italic
\let\my@orig@bm\bm
\def\bm#1{{\HCode{<mstyle class="bm">}\my@orig@bm{#1}\HCode{</mstyle>}}}
% a _ inside a preamble macro (\KL = D_\mathrm{KL} in extras.sty) was read
% before tex4ht made _ active, so it never becomes <msub>; have such macros
% re-read their body when used
\newcommand{\my@rescan}[1]{%
    \ifdefined#1%
        \edef#1{\noexpand\scantokens{\expandafter\detokenize\expandafter{#1}}}%
    \fi
}
\my@rescan\KL
\makeatother
% tex4ht writes \parallel and \| as the same relation; mark \parallel as the
% relation so web.mk4 can make \| ordinary, as it is in TeX
\renewcommand{\parallel}{\mathrel{\HCode{<mo class="MathClass-rel" data-mjx-texclass="REL">\string&\#x2225;</mo>}}}
% amsmath's \colon: a little space, an ordinary colon, then more space
% (tex4ht writes a plain colon, which TeX spaces as a relation)
\renewcommand{\colon}{\HCode{<mspace width="0.111em"></mspace><mo class="MathClass-ord" data-mjx-texclass="ORD" stretchy="false">:</mo><mspace width="0.333em"></mspace>}}
% TeX draws big delimiters and large operators from the math extension font
% at its design size (10pt), also in an 11pt document; web.mk4 scales them by
% this ratio to the body font, in percent
\makeatletter
\setbox\z@\hbox{\everymath{}$\xdef\my@exscale{\strip@pt
    \dimexpr\fontdimen6\textfont3*6553600/\dimexpr\f@size pt\relax\relax}$}
\makeatother
% MathJax rejects -tex-calligraphic unless told not to check, and the config
% has to load before MathJax, so rebuild <head> with the config first. the
% config also picks MathJax's computer modern font (its default, new computer
% modern, is heavier than the PDF, and its latin modern misplaces accents on
% Greek letters), scrolls display math that doesn't fit, and sets math at the
% size of the text, as TeX does (rather than matching x-heights, which comes
% out a bit small)
\Configure{@HEAD}{}
\Configure{@HEAD}{\HCode{<meta charset="utf-8" />\Hnewline}}
\Configure{@HEAD}{\HCode{<meta name="viewport" content="width=device-width,initial-scale=1" />\Hnewline}}
\Configure{@HEAD}{\HCode{<link rel="stylesheet" type="text/css" href="\jobname.css" />\Hnewline}}
\makeatletter
\Configure{@HEAD}{\HCode{<meta name="tex-exscale" content="\my@exscale" />\Hnewline}}
\makeatother
\Configure{@HEAD}{\HCode{<script>window.MathJax = {
    mml: { verify: { checkMathvariants: false } },
    output: { font: 'mathjax-tex', displayOverflow: 'scroll',
        matchFontHeight: false } };</script>\Hnewline}}
\Configure{@HEAD}{\HCode{<script async="async" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@4/mml-chtml.js"></script>\Hnewline}}

\makeatletter
\Css{:root {\my@light\space color-scheme: light; }}
\Css{@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {\my@dark\space color-scheme: dark; } }}
\Css{:root[data-theme="dark"] {\my@dark\space color-scheme: dark; }}
\makeatother

% latin modern, copied into fonts/ by web.mk4
\Css{@font-face { font-family: "Latin Modern Roman";
    src: url("fonts/lmroman10-regular.otf"); }}
\Css{@font-face { font-family: "Latin Modern Roman"; font-weight: bold;
    src: url("fonts/lmroman10-bold.otf"); }}
\Css{@font-face { font-family: "Latin Modern Roman"; font-style: italic;
    src: url("fonts/lmroman10-italic.otf"); }}
\Css{@font-face { font-family: "Latin Modern Roman"; font-weight: bold; font-style: italic;
    src: url("fonts/lmroman10-bolditalic.otf"); }}
\Css{@font-face { font-family: "Latin Modern Mono";
    src: url("fonts/lmmono10-regular.otf"); }}
\Css{html body { font-family: "Latin Modern Roman", serif; }}
\Css{[class*="-lmtt"] { font-family: "Latin Modern Mono", monospace; }}
% Latin Modern's no-break space (~) is 0.5em wide, its space 0.333em;
% web.mk4 marks no-break spaces, and keeps one together with the math after it
\Css{.nbsp { letter-spacing: -0.167em; }}
\Css{.nowrap { white-space: nowrap; }}

\Css{html body { background-color: var(--bg); color: var(--text); }}
% text column as wide as the PDF's, in ems of body text (6.5in at 11pt), so
% lines hold about as much; narrower screens just get the screen width
\Css{html body { max-width: 45em; margin-block-start: 2.5em; margin-block-end: 4em; }}
% type sizes, larger than the PDF's for reading on screen. tex4ht sizes other
% fonts relative to the body, and MathJax's math is as large as the text
% around it. the author and date are \large spans, which tex4ht sizes as a
% percentage of the body, rounded down; size their block to bring them to 17pt
\makeatletter
\begingroup\large\xdef\my@large{\f@size}\endgroup
\count@=\dimexpr\my@large pt\relax \multiply\count@ 100
\divide\count@ \dimexpr\f@size pt\relax
\Css{html body { font-size: 12pt; }}
\Css{h1.titleHead { font-size: 17pt; }}
\Css{div.author, div.date { font-size: \strip@pt\dimexpr 14pt*100/\count@\relax pt; }}
\Css{.sectionHead, .likesectionHead { font-size: 20pt; margin-top: 1.5em; }}
\Css{.subsectionHead, .likesubsectionHead { font-size: 14pt; margin-top: 1.5em; }}
\makeatother

% figures: \includegraphics[width=..] becomes a percentage of the column, as
% in the PDF; nothing gets wider than the column
\makeatletter
\ExplSyntaxOn
\Configure{Gin-dim}{%
    \expandafter\ifx\csname Gin:ewidth\endcsname\Gin@exclamation\else
        style="width:\fp_eval:n{round(\Gin@req@width/\linewidth*100,2)}\char_generate:nn{`\%}{12}"
    \fi
}
\ExplSyntaxOff
\makeatother
\Css{img { max-width: 100\%; height: auto; }}
\Css{figure.figure { margin-block: 1.75em; }}
\Css{img[src\string^="\jobname"] { filter: var(--picture-filter); }}
% \pencil (Stat notes' extras.sty) is scaled to 1em with \scalerel, which
% tex4ht drops
\Css{img[src\string$="/pencil.svg"] { height: 1em; vertical-align: -0.1em; }}
% table of contents: section numbers in a box of tocloft's width, so titles
% line up whether the number has one digit or two, as in the PDF (the third
% argument would add page numbers)
\ConfigureToc{section}
    {\HCode{<span class="sectionToc"><span class="tocnumber">}}
    {\HCode{</span>}}
    {}
    {\HCode{</span><br />}}
\ConfigureToc{subsection}
    {\HCode{<span class="subsectionToc"><span class="tocnumber">}}
    {\HCode{</span>}}
    {}
    {\HCode{</span><br />}}
\makeatletter
\Css{.tocnumber { display: inline-block; }}
\Css{.sectionToc .tocnumber { min-width: \my@em\cftsecnumwidth; }}
\Css{.subsectionToc { margin-left: \my@em\cftsubsecindent; }}
\Css{.subsectionToc .tocnumber { min-width: \my@em\cftsubsecnumwidth; }}
% padding, not margin, which would just collapse into the heading's
\Css{.tableofcontents { padding-bottom: 1em; }}
\makeatother
\Css{a { color: var(--link); text-decoration: none; }}
\Css{a[href\string^="\#X"] { color: var(--cite); }}
\Css{a.url, a[href\string^="mailto:"] { color: var(--url); }}
\Css{.hlpink { background-color: var(--hlpink); }}
\Css{.hlyellow { background-color: var(--hlyellow); }}
\Css{.hlblue { background-color: var(--hlblue); }}
\Css{.hlgreen { background-color: var(--hlgreen); }}
\Css{.hlpurple { background-color: var(--hlpurple); }}
\Css{.inkpink { color: var(--inkpink); }}
\Css{.inkyellow { color: var(--inkyellow); }}
\Css{.inkblue { color: var(--inkblue); }}
\Css{.inkgreen { color: var(--inkgreen); }}
\Css{.inkpurple { color: var(--inkpurple); }}
\EndPreamble
