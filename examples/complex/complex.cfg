% tex8web config for the complex example: what a heavily customized
% document can need on the web, beyond tex8web.cfg.
\Preamble{xhtml,mathjax}
\begin{document}
\input{tex8web-core.tex}

% \implies, \impliedby and \iff take a star here (\@ifstar), which breaks
% when tex4ht writes a box's title holding one into the cross-references
\robustify\implies
\robustify\impliedby
\robustify\iff

% macros MathJax can't read as the document defines them: the letter
% shortcuts made in loops (\R for \mathbb{R}, \As for \mathcal{A}, ...),
% xparse's l argument (\floor, \ceil, and \ip, which also replaces the
% physics package's), and \@ifstar (MathJax's versions have no starred form)
\WebMathMacros{
    \newcommand{\A}{\mathbb{A}}
    \newcommand{\C}{\mathbb{C}}
    \newcommand{\F}{\mathbb{F}}
    \newcommand{\N}{\mathbb{N}}
    \newcommand{\R}{\mathbb{R}}
    \newcommand{\Z}{\mathbb{Z}}
    \newcommand{\As}{\mathcal{A}}
    \newcommand{\Ab}{\textbf{A}}
    \newcommand{\Abar}{\overline{A}}
    \newcommand{\Atil}{\widetilde{A}}
    \DeclarePairedDelimiter{\floor}{\lfloor}{\rfloor}
    \DeclarePairedDelimiter{\ceil}{\lceil}{\rceil}
    \newcommand{\ip}[1]{\left\langle #1 \right\rangle}
    \newcommand{\implies}{\Rightarrow}
    \newcommand{\impliedby}{\Leftarrow}
    \newcommand{\iff}{\Leftrightarrow}
}

\EndPreamble
