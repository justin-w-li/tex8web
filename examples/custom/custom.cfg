% tex8web config for the custom example: a document with its own colors and
% boxes (tcolorbox), and a style of its own for the web.
\Preamble{xhtml,mathjax}
\begin{document}
\input{tex8web-core.tex}

% the PDF, built first (latexmk -outdir=build/pdf), linked from an icon at
% the top left
\WebPDF{build/pdf/main.pdf}

% the page's title, which tex4ht takes from \maketitle: this document has
% none
\Configure{TITLE+}{\notestitle}

% the header box: its minipages are \centering, which tex4ht doesn't
% follow, and its course line spans it, as in the PDF
\Css{\#tcolobox-1 .tcolorbox-content { text-align: center; }}
\Css{\#tcolobox-1 .fbox { margin-inline: auto; }}
\Css{\#tcolobox-1 .tabular { width: 100\%; }}

\EndPreamble
