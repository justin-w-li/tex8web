% tex8web config for the custom example: a document with its own colors and
% boxes (tcolorbox), and a style of its own for the web.
\Preamble{xhtml,mathjax}
\begin{document}
\input{tex8web-core.tex}

% the PDF, built first (latexmk -outdir=build/pdf), linked after the title
\WebPDF{build/pdf/main.pdf}

% the header box: the logos on either side of the title, as the
% document's minipages place them, and the course line below
\Css{\#tcolobox-1 .tcolorbox-content { display: grid; grid-template-columns: 16\% 1fr 16\%;
    align-items: center; justify-items: center; text-align: center; }}
\Css{\#tcolobox-1 .tcolorbox-content > p:empty { display: none; }}
\Css{\#tcolobox-1 .tabular { grid-column: 1 / -1; width: 100\%; }}

\EndPreamble
