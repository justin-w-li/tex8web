# Tests every push to main and every pull request, and publishes the
# examples to GitHub Pages from main. Builds run in TeX Live's image, pinned
# by digest: the latest tag is rebuilt weekly, and a new tex4ht can change
# the pages. The Dockerfile, the image of npm run test:contain, has the same
# digest, and both change together. To update it, take the new digest of
# texlive/texlive:latest, put it in both, and see that both test jobs pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# (a newer push to a pull request replaces its run; on main, each push's
# run finishes, deploy included)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LANG: C.UTF-8

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: &texlive
      image: texlive/texlive:latest@sha256:07e8062637249c4f780ca59f42cc2ed592bc2dc1db4320769406aee3f98aa70e
      options: --shm-size=2g
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - &install
        run: make4ht -v && npm ci
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-builds
          path: build/test

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: *texlive
    steps:
      - *checkout
      - *node
      - *install
      - run: apt-get update && apt-get install -y --no-install-recommends chromium
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-builds
          path: build/visual

  # the examples as the site, which npm run examples builds in build/site
  site:
    needs: [test, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *texlive
    steps:
      - *checkout
      - *node
      - *install
      - run: npm run examples
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
