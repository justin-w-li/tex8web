% tex8web config for test.tex, as a document's own config would be: a
% color of its own for the web (\WebColor), \term's text as a term,
% which the table of contents' filter finds (\WebTerm), and a page above it
% on its site (\WebUp)
\Preamble{xhtml,mathjax}
\begin{document}
\input{tex8web-core.tex}

\definecolor{highlight-dark}{RGB}{74, 67, 37}
\WebColor{highlight}{yellow!20}{highlight-dark}
\WebTerm\term
\WebUp{https://example.com/notes/?a=1&b=2#top}

\EndPreamble
